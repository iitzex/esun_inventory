[project]
name = "esun-inventory"
version = "0.1.0"
description = "玉山證券庫存下載與查詢工具（Electron app 後端）"
requires-python = ">=3.12"
dependencies = [
    "esun-trade",
    "keyring",
]

[tool.uv.sources]
esun-trade = { path = "vendor/esun_trade-2.2.0-cp37-abi3-macosx_11_0_arm64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python/esun_inventory"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/site-packages",
]
