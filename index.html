<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.SUN Premium Inventory Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/js/styles.css">
</head>
<body>
    <div id="sidebar">
        <div class="logo-container">
            <svg class="neon-logo" viewBox="0 0 48 24">
                <path class="neon-path" d="M0 12 L10 12 L15 4 L25 20 L30 12 L48 12" />
            </svg>
            <span class="logo-wordmark">E.SUN</span>
        </div>
        <div class="sidebar-nav">
            <div id="nav-dashboard" class="sidebar-item active" onclick="handleDashboardClick()">
                <span>Stock</span>
                <svg id="dashboard-chevron" viewBox="0 0 10 6" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; transition: transform 0.25s ease; transform: rotate(180deg);">
                    <path d="M1 5L5 1L9 5"/>
                </svg>
            </div>
            <div id="sidebar-date-menu" class="sidebar-sub-menu"></div>
        </div>

        <div class="sidebar-footer">
            <div id="nav-home" class="sidebar-item" onclick="switchView('home')">Home</div>
            <div id="nav-wallet" class="sidebar-item" onclick="switchView('wallet')">Wallet</div>
            <div id="nav-news" class="sidebar-item" onclick="switchView('news')">News</div>
            <div id="sync-btn" class="sidebar-action" onclick="handleDownload()">
                <span>SYNC</span>
                <span class="sync-icon"></span>
            </div>
            <div id="export-btn" class="sidebar-action" onclick="exportToSelfTxt()">
                <span>EXPORT</span>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <h2 id="view-title">INVESTMENT OVERVIEW</h2>
            <div id="news-range-selector" style="display: none; align-items: center; gap: 10px;">
                <span>Range</span>
                <select id="news-range-select" onchange="loadNewsInfo()">
                    <option value="0d">0D (Today)</option>
                    <option value="3d">3D</option>
                    <option value="1m">1M</option>
                    <option value="3m">3M</option>
                </select>
            </div>
            <div class="top-bar-actions">
            </div>
        </div>

        <div class="content-body">
            <!-- News View -->
            <div id="news-view" class="view-content" style="display: none;">
                <div class="dashboard-sections view-section">
                    <section>
                        <h3 class="section-title">交易委託與成交數據</h3>
                        <div id="news-info-container" class="view-col-list">
                            <div class="card card-loading">正在讀取交易數據...</div>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Home View -->
            <div id="home-view" class="view-content" style="display: none;">
                <div class="dashboard-sections view-section">
                    <section>
                        <h3 class="section-title">SDK 原始狀態數據</h3>
                        <div id="home-info-container" class="view-col-list">
                            <div class="card card-loading">正在讀取 SDK 完整資訊...</div>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Dashboard View -->
            <div id="dashboard-view" class="view-content">
                <div class="dashboard-sections view-section">
                    <div id="stats-container" class="stats-grid"></div>
                    <section>
                        <h3 class="section-title">歷史趨勢</h3>
                        <div id="history-panel" class="insight-grid"></div>
                    </section>
                    <section>
                        <h3 class="section-title">與前次快照差異</h3>
                        <div id="changes-panel" class="insight-grid"></div>
                    </section>
                    <div class="inventory-card">
                        <table>
                            <thead>
                                <tr>
                                    <th onclick="setSort('stkNa')">股票名稱<span class="sort-arrow"></span></th>
                                    <th onclick="setSort('qty')" class="th-right">庫存股數<span class="sort-arrow"></span></th>
                                    <th onclick="setSort('avgPrice')" class="th-right">平均成本<span class="sort-arrow"></span></th>
                                    <th onclick="setSort('nowPrice')" class="th-right">當前市價<span class="sort-arrow"></span></th>
                                    <th onclick="setSort('mktValue')" class="th-right">資產市值<span class="sort-arrow"></span></th>
                                    <th onclick="setSort('plSum')" class="th-right">未實現損益<span class="sort-arrow"></span></th>
                                    <th onclick="setSort('per')" class="th-right">報酬率<span class="sort-arrow"></span></th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="inventory-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Wallet View -->
            <div id="wallet-view" class="view-content" style="display: none;">
                <div class="dashboard-sections view-section">
                    <section id="bank-section">
                        <h3 class="section-title">銀行帳務 (餘額)</h3>
                        <div id="bank-staleness" class="card card-error" style="display: none;"></div>
                        <div id="bank-grid" class="stats-grid">
                            <div class="card">
                                <div class="card-label">可用餘額</div>
                                <div id="bank-available" class="card-value">--</div>
                            </div>
                            <div class="card">
                                <div class="card-label">今日票交</div>
                                <div id="bank-exchange" class="card-value">--</div>
                            </div>
                            <div class="card">
                                <div class="card-label">圈存金額 (台股)</div>
                                <div id="bank-reserved" class="card-value">--</div>
                            </div>
                        </div>
                    </section>
                    <section id="settlements-section" class="wallet-settlements">
                        <h3 class="section-title">交割資訊 (Settlements)</h3>
                        <div id="settlements-container" class="view-col-list">
                            <div class="card card-loading">暫無交割資料</div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/renderer.js"></script>
</body>
</html>
